<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mado & Mido's Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">Mado & Mido's Shop 🛍️</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="track.html">Track Package</a>
    </nav>

    <div class="header-right">
        <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle">🌙</button>

        <a href="cart.html" class="cart-button">
            Cart 🛒 <span id="cart-count">0</span>
        </a>
    </div>
</header>

<main class="login-page">

    <div class="login-card">

        <h1 id="auth-title">Login 🔐</h1>

        <p id="auth-subtitle">
            Login to your Mado & Mido account.
        </p>

        <div id="auth-message"></div>

        <label>Email</label>

        <input
            type="email"
            id="email-input"
            placeholder="you@example.com"
        >

        <label>Password</label>

        <input
            type="password"
            id="password-input"
            placeholder="Enter your password"
        >

        <button class="main-auth-btn" onclick="handleAuth()">
            Login
        </button>

        <p class="switch-auth">
            Don't have an account?
            <button onclick="toggleAuthMode()" id="switch-auth-btn">
                Sign Up
            </button>
        </p>

    </div>

</main>

<footer>
    <p>© 2026 Mado & Mido's Shop. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
