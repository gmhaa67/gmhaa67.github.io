<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mado & Mido's Shop - Track Package</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <a href="index.html" class="logo">
        Mado & Mido's Shop 🛍️
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a
            href="track.html"
            class="active-link"
        >
            Track Package
        </a>

    </nav>


    <div class="header-right">

        <button
            class="theme-btn"
            id="theme-toggle"
            onclick="toggleTheme()"
        >
            🌙
        </button>


        <div id="auth-area"></div>


        <a
            href="cart.html"
            class="cart-icon"
        >
            Cart 🛒
            <span id="cart-count">0</span>
        </a>

    </div>

</header>


<main class="tracking-page">

    <div class="tracking-card">

        <h1>
            Track Your Package 📦
        </h1>

        <p>
            Enter your order number to see your
            package status.
        </p>


        <div class="tracking-input-row">

            <input
                type="text"
                id="tracking-number"
                placeholder="Example: MADO-123456"
            >


            <button
                onclick="trackPackage()"
            >
                Track
            </button>

        </div>


        <div
            id="tracking-result"
            class="tracking-result"
        ></div>

    </div>

</main>


<script src="script.js"></script>
<script src="auth.js"></script>

</body>
</html>
